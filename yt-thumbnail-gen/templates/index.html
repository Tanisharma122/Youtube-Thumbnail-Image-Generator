<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thumbnail Bot</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="chat-container">
    <header>🎬 YouTube Thumbnail Generator</header>
    <div id="chat-window" class="chat-window"></div>

    <div id="quick-replies" class="quick-replies"></div>

    <div class="input-row">
      <input id="user-input" type="text" placeholder="Paste your video idea / topic here..." />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
